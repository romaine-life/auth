name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: romaine-life/pipeline-templates/actions/check-fetches@main
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE...HEAD")
          if grep -qvE '\.md$|^docs/|^LICENSE$' <<< "$files"; then
            echo code=true >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Validate
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: romaine-life/pipeline-templates/actions/setup-node@main
        with:
          node-version: '22'
      - name: Test and check contracts
        run: |
          set -euo pipefail
          command -v ssh-keygen
          npm ci
          npm run typecheck
          npm test
          npm run check:static-slot-origins
          npm run check:signjwt-callsites
      - uses: romaine-life/pipeline-templates/actions/setup-go@main
        with:
          go-version-file: go.mod
          cache: false
      - name: Test shared machine client on Linux
        env:
          GOMAXPROCS: '4'
        run: go test -p 4 ./...
      - uses: romaine-life/pipeline-templates/actions/setup-opentofu@main
        with:
          tofu-version: '1.11.0'
      - name: Repository lint
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, subprocess, re
          for file in subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0'):
              if not file: continue
              data = pathlib.Path(file).read_bytes()
              if data and b'\0' not in data and not data.endswith(b'\n'):
                  raise SystemExit(f'Missing trailing newline: {file}')
              if file.endswith('.yml'): raise SystemExit(f'Use .yaml: {file}')
              if '_' in file and not re.search(r'PULL_REQUEST_TEMPLATE|ISSUE_TEMPLATE|\.(go|md|js|py|webp|png|jpe?g|gif|svg|ico|txt)$', file):
                  raise SystemExit(f'Underscore in filename: {file}')
          PY
          tofu fmt -recursive -check

  client:
    needs: [changes, validate]
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    outputs:
      release-tag: ${{ steps.release.outputs.tag }}
    defaults:
      run:
        shell: pwsh
    env:
      GOMAXPROCS: '4'
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: romaine-life/pipeline-templates/actions/setup-go@main
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -p 4 ./...
      - name: Build native machine clients
        run: |
          New-Item -ItemType Directory dist | Out-Null
          foreach ($target in 'windows/amd64', 'linux/amd64', 'linux/arm64', 'darwin/amd64', 'darwin/arm64') {
            $env:GOOS, $env:GOARCH = $target.Split('/')
            $suffix = if ($env:GOOS -eq 'windows') { '.exe' } else { '' }
            go build -p 4 -trimpath -ldflags '-s -w' -o "dist/romaine-auth-$env:GOOS-$env:GOARCH$suffix" ./cmd/romaine-auth
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Sign Windows client
        env:
          PFX: ${{ secrets.AT_TERMINAL_PFX }}
          PFX_PASSWORD: ${{ secrets.AT_TERMINAL_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX) { throw 'AT_TERMINAL_PFX is not set' }
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          $pfxFile = Join-Path $env:RUNNER_TEMP 'auth-client.pfx'
          [IO.File]::WriteAllBytes($pfxFile, [Convert]::FromBase64String($env:PFX))
          try {
            & $signtool.FullName sign /fd SHA256 /f $pfxFile /p $env:PFX_PASSWORD dist/romaine-auth-windows-amd64.exe
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally { Remove-Item -LiteralPath $pfxFile }
      - uses: forgejo/upload-artifact@v4
        with:
          name: machine-clients
          path: dist/*
      - name: Release tested clients and Go module
        id: release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $last = (git tag -l 'v0.1.*' | ForEach-Object { if ($_ -match '^v0\.1\.(\d+)$') { [int]$Matches[1] } } | Measure-Object -Maximum).Maximum
          $tag = "v0.1.$($last + 1)"
          $api = "${{ github.server_url }}/api/v1/repos/${{ github.repository }}"
          $headers = @{ Authorization = "token $env:TOKEN" }
          $release = Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' "$api/releases" -Body (@{ tag_name=$tag; target_commitish=$env:GITHUB_SHA; name=$tag; draft=$true; body="Machine clients and auth source from $env:GITHUB_SHA. https://openproject.romaine.life/wp/ROMAINE-48" } | ConvertTo-Json)
          try {
            foreach ($file in Get-ChildItem dist -File) {
              Invoke-RestMethod -Method Post -Headers $headers "$api/releases/$($release.id)/assets?name=$($file.Name)" -Form @{attachment=$file} | Out-Null
            }
          } catch {
            Invoke-RestMethod -Method Delete -Headers $headers "$api/releases/$($release.id)" | Out-Null
            throw
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

  home-sync:
    needs: client
    uses: romaine-life/pipeline-templates/.forgejo/workflows/home-sync.yml@main
    secrets: inherit
    with:
      release-tag: ${{ needs.client.outputs.release-tag }}

  deploy:
    name: Publish image and checked pin PR
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [ubuntu-latest, upstairspc-linux]
    enable-openid-connect: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check image inputs
        id: inputs
        run: |
          if git diff HEAD^ HEAD --name-only | grep -qE '^(src/|package(-lock)?\.json$|tsconfig\.json$|drizzle\.config\.ts$|Dockerfile$|\.dockerignore$|\.forgejo/workflows/ci\.yaml$)'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: romaine-life/pipeline-templates/actions/azure-cli@main
        if: steps.inputs.outputs.changed == 'true'
      - uses: azure/login@v3
        if: steps.inputs.outputs.changed == 'true'
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}
      - name: Build and publish image
        if: steps.inputs.outputs.changed == 'true'
        run: |
          set -euo pipefail
          az acr login --name romainecr
          tag="${GITHUB_SHA:0:7}"
          docker build --network host -t "romainecr.azurecr.io/auth:$tag" .
          docker run --rm --network none --entrypoint sh "romainecr.azurecr.io/auth:$tag" -c 'test "$(id -u)" = 1001 && test "$(stat -c %u /app)" = 1001 && test -z "$(find /app ! -user nodejs -print -quit)"'
          docker push "romainecr.azurecr.io/auth:$tag"
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Propose the image pin
        if: steps.inputs.outputs.changed == 'true'
        env:
          TOKEN: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TOKEN"
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          branch="FORGEJO-3-image-$GITHUB_SHA"
          git checkout -b "$branch"
          sed -i -E "s|^(  tag: ).*$|\1\"$IMAGE_TAG\"|" k8s/values.yaml
          git config user.name forgejo-actions
          git config user.email forgejo-actions@noreply.romaine.life
          git add k8s/values.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore: pin auth image $IMAGE_TAG"
          # Keep the credential out of git's process arguments.
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader
          export GIT_CONFIG_VALUE_0="Authorization: Basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git push origin "HEAD:refs/heads/$branch"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          body=$(jq -n --arg head "$branch" --arg tag "$IMAGE_TAG" '{base:"main",head:$head,title:("chore: pin auth image "+$tag),body:"Validated image pin. https://openproject.romaine.life/wp/FORGEJO-3"}')
          pr=$(printf 'Authorization: token %s\n' "$TOKEN" | curl --fail-with-body -sS -X POST --header @- -H 'Content-Type: application/json' -d "$body" "$api/pulls")
          number=$(echo "$pr" | jq -r .number)
          printf 'Authorization: token %s\n' "$TOKEN" | curl --fail-with-body -sS -X POST --header @- -H 'Content-Type: application/json' -d '{"Do":"squash","merge_when_checks_succeed":true,"delete_branch_after_merge":true}' "$api/pulls/$number/merge"
